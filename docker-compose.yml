services:
  snapsync-server:
    image: ghcr.io/kahmeng15/snapsync-server:main
    container_name: snapsync-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_ROOT: /app
    volumes:
      - ./storage/photos:/app/storage/photos
      - ./storage/frames:/app/storage/frames
      - ./storage/logs:/app/storage/logs
      - ./storage/db:/app/storage/db
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  snapsync-share:
    image: ghcr.io/kahmeng15/snapsync-share:main
    container_name: snapsync-share
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      STORAGE_ROOT: /app
    volumes:
      - ./storage/photos:/app/storage/photos:ro
      - ./storage/frames:/app/storage/frames:ro
      - ./storage/logs:/app/storage/logs
      - ./storage/db:/app/storage/db
    restart: always

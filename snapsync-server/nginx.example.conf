# Example NGINX Configuration for snapsync
# This demonstrates how to securely proxy traffic to your Node.js backend
# while hosting the application on a relative path (e.g. example.com/snapsync)

server {
    listen 80;
    server_name example.com;

    # Force redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    # SSL Certificates (update with your actual cert paths)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Important: Ensure the trailing slash is included in BOTH the location and proxy_pass.
    # This automatically strips the `/snapsync/` prefix before hitting Node.js.
    location /snapsync/ {
        # Assuming the Node.js backend is running locally on port 3000
        proxy_pass http://127.0.0.1:3000/;
        
        # Websocket and modern proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forward original client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for WebSockets and streaming
        proxy_buffering off;
        proxy_read_timeout 86400; # Prevent websocket timeouts
    }
}

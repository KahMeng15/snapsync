services:
  snapsync-server-dev:
    image: node:20
    container_name: snapsync-server-dev
    working_dir: /app
    # Runs both backend and frontend development servers concurrently
    command: sh -c "cd /shared && npm install && cd /app && npm install && npx concurrently \"npm run dev\" \"npm run dev:frontend\""
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret
      REFRESH_TOKEN_SECRET: dev-refresh-secret
      OPERATOR_EMAIL: operator@snapsync.local
      OPERATOR_PASSWORD: admin123
      ALLOWED_ORIGINS: "*"
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      COOKIE_PATH: /
      VITE_BASE_URL: /
      SHARE_BASE_URL: ${SHARE_BASE_URL:-https://kmeng.ftp.sh/snapsync}
      VITE_SHARE_BASE_URL: ${VITE_SHARE_BASE_URL:-http://localhost:3001/snapsync/share}

      STORAGE_ROOT: /app
    volumes:
      - ./snapsync-server:/app
      - ./shared:/shared
      - /app/node_modules
      - /shared/node_modules
    restart: unless-stopped

  snapsync-share-dev:
    image: node:20
    container_name: snapsync-share-dev
    working_dir: /app
    command: sh -c "cd /shared && npm install && cd /app && npm install && npx concurrently \"npm run dev\" \"npm run dev:frontend\""
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      SHARE_BASE_URL: http://localhost:3001/snapsync
      ADMIN_INTERNAL_URL: http://snapsync-server-dev:3000
      INTERNAL_API_SECRET: dev-internal-secret
      STORAGE_ROOT: /app
    volumes:
      - ./snapsync-share:/app
      - ./snapsync-server/storage:/app/storage

      - ./shared:/shared
      - /app/node_modules
      - /shared/node_modules
    restart: unless-stopped
